services:
  # ─── Vault Server (Dev Engine) ──────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # ─── Vault Auto-Init (.env → Vault loader) ──
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    volumes:
      - ./vault/init-vault.sh:/init-vault.sh:ro
      - ./backend/.env:/env_file/.env:ro
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - app_network

  # ─── MongoDB (hardened, CVEs minimized) ─────
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    image: mongo-hardened
    container_name: mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?set in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set in .env}
      - MONGO_INITDB_DATABASE=fileforge
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:?set in .env}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # ─── Backend ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    expose:
      - "5000"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - app_network

  # ─── Frontend ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - NODE_ENV=production
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - app_network

  # ─── Nginx (reverse proxy / TLS termination) ──
  nginx:
    image: cgr.dev/chainguard/nginx@sha256:2189489ef3fa5b1e94a8463f98f9c148a4d8e7498d3f747069fc78de405742fc
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

volumes:
  mongo_data:
  vault_data:

networks:
  app_network:
    driver: bridge
