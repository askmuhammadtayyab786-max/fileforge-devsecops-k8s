# Template only — DO NOT commit real values. Rename to 01-secrets.yaml,
# fill in real base64 values, apply, then keep it out of git (already
# covered by the .gitignore entry added at the repo root).
#
# Generate base64 values with e.g.:
#   echo -n 'super-secret-value' | base64
#
# Fixes: "MongoDB has no authentication configured" (Tampering)
#        "No user authentication" (Spoofing) — JWT_SECRET signs login tokens
apiVersion: v1
kind: Secret
metadata:
  name: fileforge-secrets
  namespace: fileforge
type: Opaque
data:
  mongo-root-username: <base64>
  mongo-root-password: <base64>
  mongo-app-username: <base64>
  mongo-app-password: <base64>
  jwt-secret: <base64>          # openssl rand -base64 48 | base64 -w0
